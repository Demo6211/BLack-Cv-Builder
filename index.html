<style>
:root{--g:#ffd24a;--bg:#0a0a0f;--p:#14141c;--b:#2a2a38;--t:#eee}

.clk{margin:8px auto 0;font:700 28px Lato,Arial,sans-serif;letter-spacing:4px;color:#ffe9a8;direction:ltr;animation:calm 4s ease-in-out infinite alternate}.clk small{display:block;font:600 12px Cairo,Arial;letter-spacing:1px;color:#d9b85a}

ة',pts:'نقطة',k_no:'اكتب وظيفة مستهدفة لتفعيل فحص الكلمات المفتاحية (بيتحسب التقييم من 85 وتتحول لـ 100).'},

RULES:

function ats(p){const cv=$('cv'),txt=norm(cv.innerText),R=[],S=[],g=(n,m,pt,ok,tip)=>{R.push([n,pt,m,ok]);if(!ok&&tip)S.push(tip)};

const cp=(nmo?5:0)+(em?5:0)+(ph?5:0);g(ar?'بيانات التواصل (اسم، إيميل، هاتف)':'Contact (name, email, phone)',15,cp,cp==15,ar?'أضف الاسم والإيميل والهاتف في سطر التواصل.':'Add name, email and phone in the contact line.');

const jobs=[...cv.querySelectorAll('.sec[data-k=experience]:not(.hid) .job')];let full=0,bl=0;jobs.forEach(j=>{const s=j.querySelectorAll('.row span');if(s[0]&&s[0].innerText.trim()&&s[1]&&/(19|20)\d\d/.test(s[1].innerText)&&(j.querySelector('b')||{}).innerText)full++;if(j.querySelectorAll('li').length>=2)bl++});

g(ar?'كل وظيفة فيها مسمى وشركة وسنة':'Each job has title, company and a year',10,jf,jf==10,ar?'اكتب لكل وظيفة المسمى واسم الشركة والسنة.':'Give each job a title, company and year.');
g(ar?'كل وظيفة فيها نقطتين على الأقل':'Each job has 2+ bullets',10,jb,jb==10,ar?'اكتب نقطتين على الأقل لكل وظيفة من وقائع حقيقية.':'Write at least 2 bullets per job, from real facts.');
const bs=[...cv.querySelectorAll('.job li')];const good=bs.filter(l=>{const n=l.innerText.trim().split(/\s+/).length;return n>=3&&n<=28}).length,bp=bs.length?Math.round(10*good/bs.length):0;
g(ar?'طول النقاط بين 3 و28 كلمة':'Bullets are 3 to 28 words',10,bp,bp==10,ar?'اجعل كل نقطة بين 3 و28 كلمة.':'Keep each bullet between 3 and 28 words.');
const ns=cv.querySelectorAll('.sec[data-k=skills]:not(.hid) li').length,sp=ns>=6&&ns<=15?10:ns?Math.round(10*Math.min(ns,6)/6):0;
g(ar?'عدد المهارات من 6 إلى 15':'6 to 15 skills',10,sp,sp==10,ar?'اكتب من 6 إلى 15 مهارة حقيقية.':'List 6 to 15 real skills.');
g(ar?'لا تزيد عن صفحتين':'At most 2 pages',10,p<=2?10:0,p<=2,ar?'قلّل الطول لصفحتين.':'Shorten to 2 pages.');

if(tw.length){const hit=tw.filter(w=>txt.includes(w)),kp=Math.round(15*hit.length/tw.length);g((ar?'كلمات الوظيفة المستهدفة موجودة: ':'Target job words found: ')+hit.length+'/'+tw.length,15,kp,kp==15,ar?'الكلمات الناقصة: '+tw.filter(w=>!txt.includes(w)).join('، ')+' (أضفها فقط لو حقيقية).':'Missing words: '+tw.filter(w=>!txt.includes(w)).join(', ')+' (add only if true).');max=100}else S.push(T('k_no'));
if(!bs.some(l=>/[0-9٠-٩]/.test(l.innerText)))S.push(ar?'مفيش أرقام في النقاط. لو عند العميل أرقام حقيقية (عدد عملاء، نسب) أضفها، وماتخترعش أرقام.':'No numbers in the bullets. If the client has real figures, add them. Never invent any.');
const tot=R.reduce((a,r)=>a+r[2],0),sc2=Math.min(100,Math.round(tot*100/max));
$('sc').textContent=sc2;$('ring').style.setProperty('--s',sc2);$('sctxt').textContent=T('sc_note');
